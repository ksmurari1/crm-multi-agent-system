<text x="70" y="735" class="section" text-anchor="start">4  TOOLS, DATA &amp; HUMAN CONTROL</text>
<rect x="70" y="760" width="500" height="150" rx="18" fill="#E4F3EA" stroke="#2D7D5A" stroke-width="2"/>
<text x="95" y="794" class="h" text-anchor="start">CRM Tool Layer  |  tools/crm_tools.py</text>
<text x="95" y="823" class="body" text-anchor="start">• Load customer / case / incident records</text>
<text x="95" y="847" class="body" text-anchor="start">• Billing, payment and policy lookups</text>
<text x="95" y="871" class="body" text-anchor="start">• Illustrative proposed-credit calculation</text>
<rect x="620" y="760" width="510" height="150" rx="18" fill="#FFFCF6" stroke="#C9D3DD" stroke-width="2"/>
<text x="645" y="794" class="h" text-anchor="start">Structured JSON Data</text>
<text x="645" y="823" class="body" text-anchor="start">• data/crm_data.json</text>
<text x="645" y="847" class="body" text-anchor="start">• Customers • cases • IT incidents</text>
<text x="645" y="871" class="body" text-anchor="start">• Invoices • payments • policies</text>
<rect x="1180" y="760" width="550" height="150" rx="18" fill="#F0EAF8" stroke="#7656A5" stroke-width="2"/>
<text x="1205" y="794" class="h" text-anchor="start">Human Finance Manager Decision</text>
<text x="1205" y="823" class="body" text-anchor="start">• Approve / reject with required reason</text>
<text x="1205" y="847" class="body" text-anchor="start">• Persisted audit history in approval_decisions.json</text>
<text x="1205" y="871" class="body" text-anchor="start">• Approval ≠ credit/refund execution</text>
<path d="M220 690 V720 H320 V758" class="arrow"/>
<path d="M555 690 V720 H320 V758" class="arrow"/>
<path d="M890 690 V735 H870 V758" class="arrow"/>
<path d="M1225 690 V720 H1455 V758" class="arrow"/>
<path d="M1560 690 V720 H1455 V758" class="arrow"/>
<path d="M570 835 H618" class="arrow"/>
<path d="M1130 835 H1178" class="arrow"/>
<rect x="70" y="960" width="1660" height="100" rx="16" fill="#EAE5DC" stroke="#D2C8B8" stroke-width="1.5"/>
<text x="95" y="992" class="section" text-anchor="start">CROSS-CUTTING BEHAVIOUR</text>
<text x="95" y="1023" class="body" text-anchor="start">Session-only chat history  •  agent activity strip  •  runtime durations  •  separate investigation state  •  human approval gate  •  .env secret configuration</text>
<rect x="70" y="1090" width="1660" height="95" rx="14" fill="#FFF8E8" stroke="#D9C59D" stroke-width="1.5"/>
<text x="95" y="1123" class="h" text-anchor="start">DEMO BOUNDARIES</text>
<text x="95" y="1152" class="body" text-anchor="start">Local JSON persistence • rule-based routing • no RAG / vector database / knowledge graph / live web search • no production authentication or payment execution</text>
<text x="1730" y="1215" class="tiny" text-anchor="end">Architecture view | NexaTel CRM</text>
</svg>